{% extends "base.html" %}
{% block title %}Convert Lead | AcxiomCRM{% endblock %}
{% block content %}
<h1>Convert Lead</h1>
<section class="card form-card">
    <p><strong>Contact:</strong> {{ lead.contact_name }}</p>
    <p><strong>Company:</strong> {{ lead.company_name or "Not provided" }}</p>
    <p><strong>Email:</strong> {{ lead.email }}</p>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="amount">Initial Opportunity Amount (₹)</label>
        <input id="amount" type="number" min="1" step="1" name="amount" value="350000" required>
        <div class="form-actions"><button class="btn btn-success" type="submit">Convert Lead</button><a class="btn btn-secondary" href="{{ url_for('leads.leads') }}">Cancel</a></div>
    </form>
</section>
{% endblock %}
