{% extends "base.html" %}

{% block title %}Convert Lead #{{ lead.id }} - AcxiomCRM{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fa-solid fa-rotate me-2 text-success"></i>Convert Lead to Customer</h2>
    <a href="{{ url_for('leads.view', lead_id=lead.id) }}" class="btn btn-outline-secondary"><i class="fa-solid fa-arrow-left me-1"></i>Cancel</a>
</div>

<div class="card mb-4">
    <div class="card-header bg-light fw-bold"><i class="fa-solid fa-circle-info me-2"></i>Target Customer Master Record</div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('leads.convert', lead_id=lead.id) }}">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Customer Name</label>
                    <input type="text" name="customer_name" class="form-control" value="{{ lead.contact_name }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" name="customer_email" class="form-control" value="{{ lead.email }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Phone</label>
                    <input type="text" name="customer_phone" class="form-control" value="{{ lead.phone }}" required>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Address</label>
                    <textarea name="address" class="form-control" rows="2" placeholder="Optional customer billing/contact address"></textarea>
                </div>
            </div>

            <hr class="my-4">

            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="create_opportunity" name="create_opportunity" value="yes" checked onchange="toggleOppFields(this.checked)">
                <label class="form-check-label fw-bold" for="create_opportunity">Create an initial Opportunity for this customer</label>
            </div>

            <div id="oppGroup" class="row g-3 bg-light p-3 rounded border">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Opportunity Name</label>
                    <input type="text" name="opp_name" class="form-control" value="Deal - {{ lead.company_name or lead.contact_name }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Estimated Amount ($)</label>
                    <input type="number" step="0.01" name="opp_amount" class="form-control" value="5000.00">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Probability (%)</label>
                    <input type="number" min="0" max="100" name="opp_probability" class="form-control" value="25">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Expected Close Date</label>
                    <input type="date" name="opp_close_date" class="form-control" value="{{ (now).strftime('%Y-%m-%d') }}">
                </div>
            </div>

            <div class="mt-4 text-end">
                <button type="submit" class="btn btn-success px-4 py-2 fw-bold"><i class="fa-solid fa-check me-1"></i>Confirm Lead Conversion</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function toggleOppFields(checked) {
    document.getElementById('oppGroup').style.display = checked ? 'flex' : 'none';
}
</script>
{% endblock %}
