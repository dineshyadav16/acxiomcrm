{% extends "base.html" %}

{% block title %}Login - AcxiomCRM{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-header text-center bg-dark text-white py-3">
                <h4 class="mb-0 fw-bold"><i class="fa-solid fa-lock me-2"></i>AcxiomCRM Login</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.login') }}" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username or Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                            <input type="text" class="form-control" id="username" name="username" value="{{ username or '' }}" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember" value="1">
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 font-weight-bold">
                        <i class="fa-solid fa-right-to-bracket me-1"></i> Log In
                    </button>
                </form>
            </div>
            <div class="card-footer text-center text-muted py-2" style="font-size:0.85rem;">
                AcxiomCRM Baseline System &bull; Default Admin: <code>admin</code> / <code>Admin@123456</code>
            </div>
        </div>
    </div>
</div>
{% endblock %}
